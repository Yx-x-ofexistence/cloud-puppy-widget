<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">抱住一朵云 · 金毛小狗</title>
  <desc id="desc">歪着头的金毛幼犬，用两只软软的爪子抱住奶白色云朵。暖杏色毛发、垂耳、粉红脸颊与小舌头，浅粉色圆角背景。全部由可编辑矢量路径绘制。</desc>
  <defs>
    <linearGradient id="background" x1="100" y1="20" x2="414" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF0E7"/><stop offset="1" stop-color="#EED9DC"/>
    </linearGradient>
    <linearGradient id="gold" x1="210" y1="126" x2="275" y2="315" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFE0A0"/><stop offset="1" stop-color="#F5BC6F"/>
    </linearGradient>
    <linearGradient id="cloud" x1="250" y1="291" x2="250" y2="413" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFEF7"/><stop offset="1" stop-color="#E9EFF0"/>
    </linearGradient>
  </defs>

